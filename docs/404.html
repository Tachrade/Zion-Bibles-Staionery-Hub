    <script>
      // Defensive guard against browser extensions (e.g., MetaMask, Rabby, Coinbase Wallet)
      // throwing "Cannot redefine property: ethereum" when multiple web3 extensions collide in iframes
      try {
        if (!('ethereum' in window)) {
          let _eth = undefined;
          Object.defineProperty(window, 'ethereum', {
            get() { return _eth; },
            set(v) { _eth = v; },
            configurable: true,
            enumerable: true
          });
        }
      } catch (e) {
        console.warn('Ethereum shim warning ignored:', e);
      }
      // Suppress benign third-party wallet extension collision errors from halting the app
      window.addEventListener('error', function(event) {
        if (event && event.message && event.message.includes('ethereum')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
